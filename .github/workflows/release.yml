# Автоматический релиз: каждый push в main собирает подписанный APK и публикует его в Releases.
# Версия = appVersion (major.minor) из gradle.properties + номер сборки: 1.1 → 1.1.37.
# Магнитолы с Minimal Drive сами находят новую версию (Настройки → Обновления, проверка раз в сутки).
name: Release APK

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', '**/*.md', '.gitignore']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key (secret SIGNING_KEYSTORE_B64)
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Добавьте секрет SIGNING_KEYSTORE_B64 (см. README → Релизы)"; exit 1
          fi
          mkdir -p keystore
          echo "$KEYSTORE_B64" | base64 -d > keystore/minimal-drive.jks

      - name: Version
        run: |
          BASE=$(grep '^appVersion=' gradle.properties | cut -d= -f2 | cut -d. -f1,2)
          echo "VERSION=$BASE.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PappVersion="$VERSION" --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "MinimalDrive-$VERSION.apk"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Minimal Drive ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: MinimalDrive-${{ env.VERSION }}.apk
          generate_release_notes: true
          make_latest: true
