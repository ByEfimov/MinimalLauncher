# Автоматический релиз: каждый push в main собирает подписанный APK и публикует его в Releases.
# Версия = appVersion (major.minor) из gradle.properties + номер сборки: 1.1 → 1.1.37.
# Магнитолы с Minimal Drive сами находят новую версию (Настройки → Обновления, проверка раз в сутки).
name: Release APK

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', '**/*.md', '.gitignore']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key (secret SIGNING_KEYSTORE_B64)
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Добавьте секрет SIGNING_KEYSTORE_B64 (см. README → Релизы)"; exit 1
          fi
          mkdir -p keystore
          echo "$KEYSTORE_B64" | base64 -d > keystore/minimal-drive.jks

      - name: Version
        run: |
          BASE=$(grep '^appVersion=' gradle.properties | cut -d= -f2 | cut -d. -f1,2)
          echo "VERSION=$BASE.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PappVersion="$VERSION" --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "MinimalDrive-$VERSION.apk"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Minimal Drive ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: MinimalDrive-${{ env.VERSION }}.apk
          generate_release_notes: true
          make_latest: true

      # Зеркало релиза на Яндекс.Диск (белый список РФ). Нужен секрет YANDEX_DISK_TOKEN (OAuth, disk.write).
      - name: Mirror APK to Yandex Disk (optional)
        env:
          YATOKEN: ${{ secrets.YANDEX_DISK_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$YATOKEN" ]; then echo "YANDEX_DISK_TOKEN не задан — пропускаю"; exit 0; fi
          FILE="MinimalDrive-$VERSION.apk"
          AUTH="Authorization: OAuth $YATOKEN"
          MK=$(curl -s -o /dev/null -w "%{http_code}" -X PUT -H "$AUTH" "https://cloud-api.yandex.net/v1/disk/resources?path=%2FMinimalDrive")
          PUB=$(curl -s -o /dev/null -w "%{http_code}" -X PUT -H "$AUTH" "https://cloud-api.yandex.net/v1/disk/resources/publish?path=%2FMinimalDrive")
          UP=$(curl -s -H "$AUTH" "https://cloud-api.yandex.net/v1/disk/resources/upload?path=%2FMinimalDrive%2F$FILE&overwrite=true")
          HREF=$(echo "$UP" | python3 -c "import sys,json;print(json.load(sys.stdin).get('href',''))" 2>/dev/null)
          UPC=""
          if [ -n "$HREF" ]; then UPC=$(curl -s -o /dev/null -w "%{http_code}" -X PUT -T "$FILE" "$HREF"); fi
          META=$(curl -s -H "$AUTH" "https://cloud-api.yandex.net/v1/disk/resources?path=%2FMinimalDrive&fields=public_url")
          PUBLIC_URL=$(echo "$META" | python3 -c "import sys,json;print(json.load(sys.stdin).get('public_url',''))" 2>/dev/null)
          printf '{"public_url":"%s","mkdir":"%s","publish":"%s","upload":"%s"}' "$PUBLIC_URL" "$MK" "$PUB" "$UPC" > yadisk.json
          cat yadisk.json
          gh release upload "v$VERSION" yadisk.json --clobber || true
