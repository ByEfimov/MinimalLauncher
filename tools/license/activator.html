<!doctype html><html lang=ru><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>Minimal Drive — код активации</title>
<style>
:root{--bg:#0c0e0f;--card:#141618;--stroke:#26292c;--text:#fff;--muted:#8c9195;--acc:#ffd23a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:17px/1.45 -apple-system,system-ui,sans-serif;padding:22px}
.wrap{max-width:460px;margin:0 auto}h1{font-size:22px;margin:6px 0 4px}.sub{color:var(--muted);font-size:14px;margin-bottom:18px}
label{color:var(--muted);font-size:13px;letter-spacing:1px}
input{width:100%;padding:16px;border-radius:14px;border:1px solid var(--stroke);background:#17191b;color:#fff;font-size:34px;text-align:center;letter-spacing:8px;font-family:ui-monospace,monospace;margin:8px 0 4px}
.card{background:var(--card);border:1px solid var(--stroke);border-radius:16px;padding:20px;margin-top:14px}
.out{font-family:ui-monospace,monospace;font-size:48px;font-weight:700;letter-spacing:10px;text-align:center;color:var(--acc);margin:6px 0}
.hint{color:var(--muted);font-size:13px;text-align:center}
</style>
<div class=wrap>
  <h1>Код активации</h1>
  <div class=sub>Работает без интернета. Введите код магнитолы — получите код активации.</div>
  <div class=card>
    <label>КОД МАГНИТОЛЫ (6 цифр)</label>
    <input id=dev inputmode=numeric maxlength=6 placeholder="000000" autofocus>
    <div id=res></div>
  </div>
  <p class=hint>Один код активации подходит только к одной магнитоле. Держите этот файл при себе — в нём секретный ключ, не выкладывайте его в интернет.</p>
</div>
<script>
const SECRET_HEX="cadc395e1af8e1fb77ef18e99f85e59d3165a8ec9b32dc8baf34ca7e7ae74439";
const dev=document.getElementById('dev'), res=document.getElementById('res');
function hex2buf(h){const a=new Uint8Array(h.length/2);for(let i=0;i<a.length;i++)a[i]=parseInt(h.substr(i*2,2),16);return a}
async function calc(){
  const d=dev.value.replace(/\D/g,'').slice(0,6);
  if(d.length!==6){res.innerHTML='<div class=hint>Введите 6 цифр</div>';return}
  const key=await crypto.subtle.importKey('raw',hex2buf(SECRET_HEX),{name:'HMAC',hash:'SHA-256'},false,['sign']);
  const mac=new Uint8Array(await crypto.subtle.sign('HMAC',key,new TextEncoder().encode(d)));
  let n=0n;for(let i=0;i<8;i++)n=(n<<8n)|BigInt(mac[i]);
  const code=String(n%1000000n).padStart(6,'0');
  res.innerHTML='<label>КОД АКТИВАЦИИ</label><div class=out>'+code+'</div><div class=hint>для магнитолы '+d+'</div>';
}
dev.addEventListener('input',calc);
</script>
