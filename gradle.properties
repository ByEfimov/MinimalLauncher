org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official
# GitHub repo for over-the-air updates, e.g. nikita/minimal-drive (leave empty to disable)
updateRepo=ByEfimov/MinimalLauncher
# Яндекс Карты: ключ MapKit Mobile SDK (https://developer.tech.yandex.ru). Пусто — используется OpenStreetMap
yandexMapKitKey=
# Версия: major.minor меняете вы, третья цифра — номер сборки GitHub (релиз при каждом push в main)
appVersion=1.3.0
