org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official
# GitHub repo for over-the-air updates, e.g. nikita/minimal-drive (leave empty to disable)
updateRepo=ByEfimov/MinimalLauncher
# Публичная папка Яндекс.Диска с релизами (белый список РФ): запасной источник обновлений,
# когда GitHub недоступен. Вставьте публичную ссылку вида https://disk.yandex.ru/d/XXXX. Пусто — выкл.
updateYandexDisk=https://disk.yandex.ru/d/4z3u6-caQKO_UA
# Адрес сервиса активации (Cloudflare Worker). Пусто → активация только вручную вставкой кода.
activationUrl=
# Яндекс Карты: ключ MapKit Mobile SDK (https://developer.tech.yandex.ru). Пусто — используется OpenStreetMap
yandexMapKitKey=
# Прокси на Yandex Cloud Functions (домен *.yandexcloud.net в белом списке РФ): погода и ограничения скорости.
# Работает даже при ограничениях: магнитола ходит только на yandexcloud.net, функция сама берёт данные.
proxyUrl=https://functions.yandexcloud.net/d4euj8crb8bnkkleh22l
# Версия: major.minor меняете вы, третья цифра — номер сборки GitHub (релиз при каждом push в main)
appVersion=1.23.0
